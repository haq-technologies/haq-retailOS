# Development stack for the shop server (PLAN.md, Phase 2). For the development computer only, never
# for a shop: the code is bind-mounted and the passwords are development placeholders. The production
# stack (images from GHCR pinned by digest, no bind mounts) comes later in Phase 2. Versions are pinned (D20).
#
# The running containers connect as retail_app. Only the one-shot migrate and test services hold the
# owner role's password, as in a shop (spec section 4).
#
# First run: apps/shop-server/docker/dev-setup.sh
# Then:      docker compose up -d     and open http://localhost:8080
# Migrate:   docker compose run --rm migrate
# Test:      docker compose run --rm test

name: retail-os

x-php: &php
  image: retail-os/shop-server-dev:local
  build:
    context: .
    dockerfile: apps/shop-server/docker/php/Dockerfile
    target: dev
  volumes:
    - ./apps/shop-server:/app
  environment: &app-env
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: retail
    DB_USERNAME: retail_app
    DB_PASSWORD: app-dev
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

x-owner-env: &owner-env
  <<: *app-env
  DB_OWNER_USERNAME: retail_owner
  DB_OWNER_PASSWORD: owner-dev

services:
  # PHP-FPM, serving the app to nginx.
  app:
    <<: *php

  # Queue worker: jobs live in PostgreSQL (no Redis). The print queue joins it in Phase 3.
  queue:
    <<: *php
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3"]

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  # The one-shot migration job: migrates as the owner role, then applies the mutability matrix.
  migrate:
    <<: *php
    profiles: [tools]
    restart: "no"
    environment: *owner-env
    command: ["sh", "-c", "php artisan migrate --database=pgsql_owner --force && php artisan db:mutability --database=pgsql_owner"]

  # Pest, against the retail_test database: it rebuilds the schema as the owner and tests as retail_app.
  test:
    <<: *php
    profiles: [tools]
    restart: "no"
    environment: *owner-env
    entrypoint: ["composer", "test", "--"]
    command: []

  web:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./apps/shop-server/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/shop-server/public:/app/public:ro
    depends_on:
      - app
    restart: unless-stopped

  # The Vite dev server, with hot reload for the React pages.
  vite:
    image: node:26.13.0-alpine3.24
    working_dir: /app
    command: ["npm", "run", "dev"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./apps/shop-server:/app
    environment:
      # Colima does not pass file-change events into its VM, so Vite polls for changes.
      VITE_POLL: "1"
    restart: unless-stopped

  # PostgreSQL. Its port is never published (spec section 4); use `docker compose exec db psql -U postgres`.
  # The roles and databases are created by docker/postgres/init/01-roles.sh when the volume is new.
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev
      RETAIL_OWNER_PASSWORD: owner-dev
      RETAIL_APP_PASSWORD: app-dev
      RETAIL_REPORTING_PASSWORD: reporting-dev
    volumes:
      - db-data:/var/lib/postgresql
      - ./apps/shop-server/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP, so the check passes only once initialisation is over and the real server listens.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d retail"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  db-data:
