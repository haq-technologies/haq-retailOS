# Development stack for the shop server (PLAN.md, Phase 2). For the development computer only, never
# for a shop: the code is bind-mounted and the passwords are development placeholders. The production
# stack (images from GHCR pinned by digest, no bind mounts, the one-shot migration job and three database
# roles) comes later in Phase 2. Image versions are pinned (D20).
#
# First run: apps/shop-server/docker/dev-setup.sh
# Then:      docker compose up -d     and open http://localhost:8080

name: retail-os

x-php: &php
  image: retail-os/shop-server-dev:local
  build:
    context: .
    dockerfile: apps/shop-server/docker/php/Dockerfile
    target: dev
  volumes:
    - ./apps/shop-server:/app
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: retail
    DB_USERNAME: retail
    DB_PASSWORD: retail-dev
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  # PHP-FPM, serving the app to nginx.
  app:
    <<: *php

  # Queue worker: jobs live in PostgreSQL (no Redis). The print queue joins it in Phase 3.
  queue:
    <<: *php
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3"]

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  web:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./apps/shop-server/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/shop-server/public:/app/public:ro
    depends_on:
      - app
    restart: unless-stopped

  # The Vite dev server, with hot reload for the React pages.
  vite:
    image: node:26.13.0-alpine3.24
    working_dir: /app
    command: ["npm", "run", "dev"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./apps/shop-server:/app
    environment:
      # Colima does not pass file-change events into its VM, so Vite polls for changes.
      VITE_POLL: "1"
    restart: unless-stopped

  # PostgreSQL. Its port is never published (spec section 4); use `docker compose exec db psql -U retail`.
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail-dev
    volumes:
      - db-data:/var/lib/postgresql
      - ./apps/shop-server/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  db-data:
