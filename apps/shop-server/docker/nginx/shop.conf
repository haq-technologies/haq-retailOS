# nginx for a shop's server (spec section 4). Counters reach the server over HTTPS with a certificate from
# the shop's own certificate authority (made at install by shop:make-certificate); plain HTTP only
# redirects. PHP runs in the app container.

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    location = /up { proxy_pass http://127.0.0.1:8081/up; }
    location / { return 301 https://$host$request_uri; }
}

# The health check answers on a loopback port too, so it works before a certificate is trusted.
server {
    listen 127.0.0.1:8081;
    root /app/public;
    location = /up {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/haq/tls/server.crt;
    ssl_certificate_key /etc/haq/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;

    root /app/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Built assets carry a content hash in their names, so they can be cached for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
