# nginx for a shop's server (spec section 4). Counters reach the server over HTTPS with a certificate from
# the shop's own certificate authority (made at install by shop:make-certificate). Plain HTTP serves only
# what a new device needs before it trusts that authority: the setup page, the authority's certificate
# (public, never a key) and its thumbprint (D59). Everything else redirects to HTTPS. PHP runs in the app
# container.

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    location = /up { proxy_pass http://127.0.0.1:8081/up; }
    location = /setup {
        alias /usr/share/haq/setup.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
    }
    location = /ca.crt {
        alias /etc/haq/tls/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="haq-shop-ca.crt"' always;
        add_header Cache-Control "no-store" always;
    }
    location = /ca.thumbprint {
        alias /etc/haq/tls/ca.thumbprint;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }
    location / { return 301 https://$host$request_uri; }
}

# The health check answers on a loopback port too, so it works before a certificate is trusted.
server {
    listen 127.0.0.1:8081;
    root /app/public;
    location = /up {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/haq/tls/server.crt;
    ssl_certificate_key /etc/haq/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;

    root /app/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Reboot recovery (spec section 4) [D46]: while PHP or the database is still starting (a 502 from nginx,
    # or the app's own 503), a page that waits and opens what was asked for by itself. The status stays,
    # so a counter's API calls still see the server as not ready and show Reconnecting.
    error_page 502 503 504 /starting.html;
    location = /starting.html {
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        try_files $uri =404;
    }

    # The setup page answers over HTTPS too, once the device trusts the authority (D59).
    location = /setup {
        alias /usr/share/haq/setup.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }
    location = /ca.thumbprint {
        alias /etc/haq/tls/ca.thumbprint;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # Built assets carry a content hash in their names, so they can be cached for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The counter's service worker is checked on every load, so a new release reaches the counters at once.
    location = /counter-sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_intercept_errors on;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
