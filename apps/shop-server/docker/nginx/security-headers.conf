# The security headers on every answer from a shop's server (spec section 4). nginx drops a server's
# add_header lines in any location that has add_header lines of its own, so each such location includes
# this file again (D123); tools/ci/check_nginx_headers.py fails the build if one does not. Browsers ignore
# Strict-Transport-Security over plain HTTP, so the HTTP pages carry it harmlessly.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
