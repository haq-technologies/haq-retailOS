# nginx in front of PHP-FPM for the development stack. HTTPS with the shop's local certificate
# authority comes with the production stack (spec section 4).
server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;
    server_tokens off;

    # While PHP is restarting, the same "Starting, please wait" page as a shop's server (D46).
    error_page 502 504 /starting.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    # Only index.php runs PHP.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
