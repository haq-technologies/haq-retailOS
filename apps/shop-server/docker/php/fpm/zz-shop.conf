; php-fpm for the shop server, loaded after the PHP image's own docker.conf.

[www]
; No access log (finding LG4). The PHP image writes one line per request to the container's log, which
; nginx already logs, with D75's filter that leaves out the counters' polls that went well. Here every poll
; was a line, about 11 MB a day per counter, and the app's 50 MB cap then kept only a few days of errors.
access.log = /dev/null
