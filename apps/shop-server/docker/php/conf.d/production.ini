; PHP settings for a shop's server, on top of php.ini-production and app.ini.

; The code never changes inside a running image, so OPcache never rechecks the files.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

display_errors = Off
log_errors = On
