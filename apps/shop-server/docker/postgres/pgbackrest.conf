# pgBackRest for one branch (spec section 9) [S16, F24]: repository 1 on the second internal disk,
# mounted at /backup. A full backup each week, an incremental each day; four fulls are kept, so seven
# daily and four weekly copies are always there. The cloud copy (repository 2) comes with the MVP.
[global]
repo1-path=/backup/repo
repo1-retention-full=4
repo1-retention-full-type=count
repo1-bundle=y
repo1-block=y
compress-type=zst
process-max=2
start-fast=y
log-path=/backup/log
log-level-console=info
log-level-file=info
lock-path=/tmp/pgbackrest

[shop]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
