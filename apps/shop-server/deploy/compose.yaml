# A shop's server (spec section 4): the branch's Compose stack, from images on GHCR. No code is
# bind-mounted; the database, storage and certificates live in named volumes. Secrets come from the
# install folder: the app key and the app's password from .env, and the owner's and the superuser's
# passwords from files under secrets/, mounted only into the containers that need them.
#
# The one-shot migrate job runs before the app starts on every `up`; it alone holds the owner role's
# password, and it exits once the schema and the mutability matrix are in place (spec section 4) [F3].
# Installed and updated by deploy/install.sh.

name: haq-retail-os

x-app: &app
  image: ${APP_IMAGE}
  environment: &app-env
    APP_KEY: ${APP_KEY}
    APP_URL: https://${SERVER_NAME}
    DB_HOST: db
    DB_DATABASE: retail
    DB_USERNAME: retail_app
    DB_PASSWORD: ${RETAIL_APP_PASSWORD}
    SESSION_SECURE_COOKIE: "true"
  volumes:
    - storage:/app/storage
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: ${DB_IMAGE}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - db-data:/var/lib/postgresql
      - pg-socket:/var/run/postgresql
      # The second internal disk (spec section 9): WAL is archived there continuously.
      - ${BACKUP_DIR:-backup-repo}:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped
    # The database port is never published (spec section 4).

  # One-shot: creates or updates the three roles and the database, then exits, so no running container
  # holds the owner's password (spec section 14, check D).
  roles:
    image: ${DB_IMAGE}
    entrypoint: ["/usr/local/bin/haq-roles.sh"]
    environment:
      PGHOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      RETAIL_OWNER_PASSWORD_FILE: /run/secrets/owner_password
      RETAIL_APP_PASSWORD_FILE: /run/secrets/app_password
      RETAIL_REPORTING_PASSWORD_FILE: /run/secrets/reporting_password
      RETAIL_DATABASES: retail
    secrets: [postgres_password, owner_password, app_password, reporting_password]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: *app
    depends_on:
      roles:
        condition: service_completed_successfully
    secrets: [owner_password]
    restart: "no"
    command:
      - sh
      - -c
      - DB_OWNER_PASSWORD="$$(cat /run/secrets/owner_password)" php artisan migrate --database=pgsql_owner --force
        && DB_OWNER_PASSWORD="$$(cat /run/secrets/owner_password)" php artisan db:mutability --database=pgsql_owner

  # Makes the HTTPS certificate on the first start; a later start keeps it while it is still good.
  certificate:
    <<: *app
    volumes:
      - storage:/app/storage
      - tls:/tls
    restart: "no"
    command: ["php", "artisan", "shop:make-certificate", "--name=${SERVER_NAME}", "--ip=${SERVER_IP}", "--tls-dir=/tls"]

  app:
    <<: *app
    command: ["php-fpm"]

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--queue=print,default", "--sleep=1", "--tries=3"]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *app-env
      BACKUP_STATUS_DIR: /backup/status
      BACKUP_RESTORE_HOST: backup
    volumes:
      - storage:/app/storage
      - ${BACKUP_DIR:-backup-repo}:/backup

  # Backups (spec section 9) [S16, F24]: pgBackRest beside PostgreSQL. A weekly full and daily
  # incrementals with catch-up, retention of four weeks, and the weekly test restore that the scheduler
  # verifies. The updater runs `haq-backup.sh full` here before every update.
  backup:
    image: ${DB_IMAGE}
    user: postgres
    entrypoint: ["/usr/local/bin/haq-backup.sh"]
    environment:
      TZ: ${SHOP_TIMEZONE:-Africa/Lagos}
    volumes:
      - db-data:/var/lib/postgresql:ro
      - pg-socket:/var/run/postgresql
      - ${BACKUP_DIR:-backup-repo}:/backup
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # One-shot, only for deploy/restore.sh (profile restore): pgBackRest writes the latest backup and every
  # archived WAL segment into the database volume while PostgreSQL is stopped.
  restore:
    image: ${DB_IMAGE}
    profiles: [restore]
    user: postgres
    entrypoint: ["pgbackrest", "--stanza=shop", "--delta", "restore"]
    volumes:
      - db-data:/var/lib/postgresql
      - ${BACKUP_DIR:-backup-repo}:/backup
    restart: "no"

  # Staging only (COMPOSE_PROFILES=standin): a stand-in receipt printer. A shop never runs it.
  printer:
    <<: *app
    profiles: [standin]
    command: ["php", "artisan", "printing:fake-printer", "--port=9100"]

  web:
    image: ${WEB_IMAGE}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - tls:/etc/haq/tls:ro
    depends_on:
      app:
        condition: service_started
      certificate:
        condition: service_completed_successfully
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  owner_password:
    file: ./secrets/owner_password
  app_password:
    file: ./secrets/app_password
  reporting_password:
    file: ./secrets/reporting_password

volumes:
  db-data:
  storage:
  tls:
  pg-socket:
  # Only when no second disk is given: backups then share the database's disk, which the installer warns of.
  backup-repo:
