# CI for HAQ Retail OS. On every pull request, on main and every Monday it guards the documents and the
# catalogue, and checks the shop server: PHP style, static analysis, the dependency audits and the tests
# against a real PostgreSQL (feature, with a coverage floor, and the multi-process suite); the frontend's
# lint, types, tests and build; Playwright in Chromium; the upgrade path; the restore drill; and every image,
# built and scanned. Third-party actions are pinned by commit (D65).
name: CI

on:
  pull_request:
  # main, and a release branch: a fix for a release already out, cut from its tag (D81).
  push:
    branches: [main, "release/**"]
  # Weekly, so a new advisory or a broken restore shows up even in a week with no change (D65).
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Rebuild catalogue v1.1 and compare with the committed files
        run: |
          out="$RUNNER_TEMP/catalogue"
          mkdir -p "$out"
          python3 -I tools/catalogue/build_catalogue_v11.py docs/archive/starter-catalogue-v1.json \
            "$out/starter-catalogue-v1.1.json" "$out/starter-catalogue-v1.1.xlsx" "$out/appendix-c-starter-catalogue-v1.1.md"
          for f in starter-catalogue-v1.1.json starter-catalogue-v1.1.xlsx appendix-c-starter-catalogue-v1.1.md; do
            cmp "$out/$f" "docs/catalogue/$f" || { echo "::error file=docs/catalogue/$f::Generated file is out of date. Rerun the build command in CLAUDE.md and commit the result."; exit 1; }
          done

      - name: Verify catalogue v1.1
        run: |
          python3 -I tools/catalogue/verify_v11.py docs/archive/starter-catalogue-v1.json \
            docs/catalogue/starter-catalogue-v1.1.json docs/catalogue/starter-catalogue-v1.1.xlsx \
            docs/catalogue/appendix-c-starter-catalogue-v1.1.md

      - name: Check Markdown tables and links
        run: python3 -I tools/docs/check_markdown.py

      # nginx drops a server's headers in a location that adds its own, so each one includes them again (D123).
      - name: Check the shop's nginx sends the security headers on every answer
        run: python3 -I tools/ci/check_nginx_headers.py apps/shop-server/docker/nginx/shop.conf

      - name: Release signing dry run (a throwaway key; the updater's own checks)
        run: tools/release/dry-run.sh

      # The support file holds what HAQ support needs and never a secret (finding LG7).
      - name: Support file self-test
        run: tools/ci/support-file-test.sh

  # The Windows setup's scripts (D86): ShellCheck for what runs inside Linux, and PowerShell's own parser and
  # PSScriptAnalyzer for what runs on Windows. The scripts themselves run on Windows, in the spike.
  windows-scripts:
    name: windows scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ShellCheck
        run: find apps/windows -name '*.sh' -print0 | xargs -0 --no-run-if-empty shellcheck

      - name: PowerShell parser and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          $failed = $false
          foreach ($file in Get-ChildItem apps/windows -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host ("{0}:{1}: {2}" -f $file.FullName, $e.Extent.StartLineNumber, $e.Message); $failed = $true }
            # Windows PowerShell 5.1 reads a file with no byte-order mark as ANSI, so the scripts stay ASCII.
            $text = [System.IO.File]::ReadAllText($file.FullName)
            if ($text -match '[^\x00-\x7F]') { Write-Host "$($file.FullName): not ASCII"; $failed = $true }
          }
          # Write-Host and the spike's one-time password handling are deliberate; the parameters are used by functions.
          $findings = Invoke-ScriptAnalyzer -Path apps/windows -Recurse -Severity Warning, Error -ExcludeRule `
            PSAvoidUsingWriteHost, PSAvoidUsingPlainTextForPassword, PSAvoidUsingConvertToSecureStringWithPlainText, `
            PSUseShouldProcessForStateChangingFunctions, PSReviewUnusedParameter, PSUseBOMForUnicodeEncodedFile
          $findings | Format-Table -AutoSize RuleName, ScriptName, Line, Message -Wrap | Out-String -Width 200 | Write-Host
          if ($findings -or $failed) { exit 1 }

      - name: No function hides a script-level variable
        shell: pwsh
        run: pwsh -NoProfile -File tools/ci/powershell-names.ps1 apps/windows

  # The haq-server distribution (D86): Ubuntu with systemd, Docker and this commit's shop server installer, as
  # the tar the Windows setup imports into WSL2. Built and checked on every pull request, and handed to the
  # setup's job; the one built on main or a release branch is kept for 90 days, for that commit's release.
  windows-distro:
    name: windows distro
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and check the distribution
        run: apps/windows/distro/build.sh --out "$RUNNER_TEMP/distro"

      - name: Keep it for the setup, and from main for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: haq-server-distro
          path: |
            ${{ runner.temp }}/distro/haq-server.tar.gz
            ${{ runner.temp }}/distro/haq-server.tar.gz.sha256
          retention-days: ${{ github.event_name == 'push' && 90 || 3 }}
          compression-level: 0
          if-no-files-found: error

  # The HAQ Helper, in Go (D88): the print bridge and what the setup needs to choose a printer (D87). Its tests
  # run here with the race detector, against a stand-in printer; the Windows code is vetted and built here too.
  windows-helper:
    name: windows helper
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/windows/helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/windows/helper/go.mod
          cache-dependency-path: apps/windows/helper/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: go vet, for Linux and for Windows
        run: go vet ./... && GOOS=windows go vet ./...

      - name: Tests, with the race detector
        run: go test -race -count=1 ./...

      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build for Windows
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o haq-helper.exe ./cmd/haq-helper

  # On Windows itself: a print queue on a file port stands in for a USB receipt printer's queue, and a RAW
  # job must reach it byte for byte (D87).
  windows-helper-on-windows:
    name: windows helper on Windows
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/windows/helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/windows/helper/go.mod
          cache-dependency-path: apps/windows/helper/go.sum

      - name: A print queue on a file port
        shell: pwsh
        run: |
          Start-Service Spooler
          $file = Join-Path $env:RUNNER_TEMP 'haq-queue.prn'
          Add-PrinterDriver -Name 'Generic / Text Only'
          Add-PrinterPort -Name $file
          Add-Printer -Name 'HAQ Test Queue' -DriverName 'Generic / Text Only' -PortName $file
          "HAQ_TEST_QUEUE=HAQ Test Queue" >> $env:GITHUB_ENV
          "HAQ_TEST_QUEUE_FILE=$file" >> $env:GITHUB_ENV

      - name: Tests, on Windows
        run: go test -count=1 -v ./...

      - name: The printer list, as the setup reads it
        shell: pwsh
        run: |
          go build -trimpath -o haq-helper.exe ./cmd/haq-helper
          ./haq-helper.exe printers
          ./haq-helper.exe printers --json

      # The service as Windows runs it, as the system account: a counter whose server is this runner itself,
      # its receipt printer a file. Installed twice (an update keeps the one service), started, a receipt sent
      # through its bridge from the server's address, then stopped and removed.
      - name: The HAQ Helper service, as Windows runs it
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'haq-helper.exe'
          go build -trimpath -o $exe ./cmd/haq-helper
          $receipts = Join-Path $env:RUNNER_TEMP 'bridge-receipts.bin'
          New-Item -ItemType Directory -Force C:\ProgramData\HAQ | Out-Null
          @{ mode = 'counter'; address = '127.0.0.1'; server = '127.0.0.1'; printer = "file:$receipts"; listen = '127.0.0.1:9101' } |
            ConvertTo-Json | Set-Content C:\ProgramData\HAQ\helper.json -Encoding ascii
          function Helper { & $exe @args; if ($LASTEXITCODE) { throw "haq-helper $args failed" } }
          Helper service install
          Helper service install
          Helper service start
          if ((Helper service state) -ne 'running') { throw 'the service is not running' }
          sc.exe qfailure HAQHelper | Write-Host

          $job = [byte[]]((0x1b, 0x40) + [Text.Encoding]::ASCII.GetBytes("A receipt through the service`n"))
          $deadline = (Get-Date).AddSeconds(30)
          while ($true) {
            try { $client = [Net.Sockets.TcpClient]::new('127.0.0.1', 9101); break }
            catch { if ((Get-Date) -gt $deadline) { throw 'the bridge never listened' }; Start-Sleep -Milliseconds 500 }
          }
          $stream = $client.GetStream(); $stream.Write($job, 0, $job.Length); $client.Close()
          while (-not ((Test-Path $receipts) -and ((Get-Item $receipts).Length -eq $job.Length))) {
            if ((Get-Date) -gt $deadline) { throw 'the receipt never reached the printer' }
            Start-Sleep -Milliseconds 200
          }
          if (Compare-Object $job ([IO.File]::ReadAllBytes($receipts)) -SyncWindow 0) { throw 'the receipt changed on the way' }

          Helper service stop
          if ((Helper service state) -ne 'stopped') { throw 'the service did not stop' }
          Helper service remove
          if ((Helper service state) -ne 'not installed') { throw 'the service is still there' }
          Get-Content C:\ProgramData\HAQ\logs\service.log

      - name: The PC's report and drives, as the server reads them
        shell: pwsh
        run: |
          go build -trimpath -o haq-helper.exe ./cmd/haq-helper
          $raw = ./haq-helper.exe health
          if ($LASTEXITCODE) { throw 'health failed' }
          $raw | Write-Host
          $report = ($raw -join "`n") | ConvertFrom-Json
          if ($report.written_at -le 0 -or $null -eq $report.disks) { throw 'the report is not as host-report needs it' }
          ./haq-helper.exe drives

      # The install engine's first part for the server's PC, which needs no WSL: the hidden HAQServer account
      # with its one right, its folders and its tasks; then a command run as HAQServer through the runner task.
      - name: The setup's hidden account and its runner
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'haq-helper.exe'
          go build -trimpath -o $exe ./cmd/haq-helper
          & $exe setup prepare; if ($LASTEXITCODE) { throw 'setup prepare failed' }
          Get-ScheduledTask -TaskPath '\HAQ Retail OS\' | Format-Table TaskName, State, @{ n = 'User'; e = { $_.Principal.UserId } } | Out-String | Write-Host
          $who = (& $exe as-server cmd.exe /c whoami) -join ''
          if ($LASTEXITCODE) { throw "as-server failed: $who" }
          if ($who.Trim() -ne "$env:COMPUTERNAME\HAQServer") { throw "the runner ran as $who, not HAQServer" }
          Write-Host "The runner ran as $who"
          & $exe as-server cmd.exe /c 'exit 7'
          if ($LASTEXITCODE -ne 7) { throw "the runner gave code $LASTEXITCODE, not 7" }
          Write-Host 'The runner gave back the exit code, 7'
          exit 0

      # A whole counter install, against a stand-in shop server on 127.0.0.2 that serves its certificate and
      # thumbprint as nginx does: the certificate trusted, the bridge for a file printer letting in only the
      # server, the start-up shortcut, and the page that registers it. Then removed.
      - name: The setup's counter install, then its removal
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'haq-helper.exe'
          $site = Join-Path $env:RUNNER_TEMP 'shop-site'
          New-Item -ItemType Directory -Force $site | Out-Null
          $ca = New-SelfSignedCertificate -Subject 'CN=HAQ Retail OS shop authority' -CertStoreLocation Cert:\CurrentUser\My `
            -KeyUsage CertSign, CRLSign -TextExtension @('2.5.29.19={critical}{text}ca=1')
          $pem = "-----BEGIN CERTIFICATE-----`n" + [Convert]::ToBase64String($ca.RawData, 'InsertLineBreaks') + "`n-----END CERTIFICATE-----`n"
          [IO.File]::WriteAllText((Join-Path $site 'ca.crt'), $pem)
          [IO.File]::WriteAllText((Join-Path $site 'ca.thumbprint'), (($ca.Thumbprint -split '(.{4})' | Where-Object { $_ }) -join ' ') + "`n")
          Remove-Item "Cert:\CurrentUser\My\$($ca.Thumbprint)"
          # Through Windows' own HTTP service, which holds port 80 on the runner, as nginx would answer.
          $shop = Start-Job -ArgumentList $site -ScriptBlock {
            param($site)
            $listener = [Net.HttpListener]::new(); $listener.Prefixes.Add('http://127.0.0.2:80/'); $listener.Start()
            while ($listener.IsListening) {
              $context = $listener.GetContext()
              $file = Join-Path $site $context.Request.Url.AbsolutePath.TrimStart('/')
              if (Test-Path $file -PathType Leaf) { $body = [IO.File]::ReadAllBytes($file) } else { $body = [byte[]]@(); $context.Response.StatusCode = 404 }
              $context.Response.OutputStream.Write($body, 0, $body.Length); $context.Response.Close()
            }
          }
          $deadline = (Get-Date).AddSeconds(30)
          while ($true) {
            try { Invoke-WebRequest http://127.0.0.2/ca.thumbprint -UseBasicParsing | Out-Null; break }
            catch { if ((Get-Date) -gt $deadline) { Receive-Job $shop; throw 'the stand-in server never answered' }; Start-Sleep 1 }
          }

          # As on a new counter: nothing of HAQ's on the PC yet.
          Remove-Item C:\ProgramData\HAQ -Recurse -Force -ErrorAction SilentlyContinue
          $receipts = Join-Path $env:RUNNER_TEMP 'counter-receipts.bin'
          $answers = Join-Path $env:RUNNER_TEMP 'answers.json'
          $result = Join-Path $env:RUNNER_TEMP 'result.json'
          # A thumbprint that is not the certificate's, as if an impostor answered for the server: the setup
          # stops, and Windows does not trust the certificate (D125).
          @{ mode = 'counter'; address = '127.0.0.1'; server = '127.0.0.2'; counter = 'T02'; code = '4827-1093'; thumbprint = 'AB12 CD34 EF56 7890'; printer = "file:$receipts" } |
            ConvertTo-Json | Set-Content $answers -Encoding ascii
          & $exe setup counter --answers $answers --result $result; if (-not $LASTEXITCODE) { throw 'setup counter trusted a certificate whose thumbprint was not the one typed' }
          if (Get-ChildItem Cert:\LocalMachine\Root | Where-Object Thumbprint -eq $ca.Thumbprint) { throw 'the certificate was trusted with the wrong thumbprint' }
          # The first 16 characters, as `haq enrol` shows them on the server.
          @{ mode = 'counter'; address = '127.0.0.1'; server = '127.0.0.2'; counter = 'T02'; code = '4827-1093'; thumbprint = (($ca.Thumbprint.Substring(0, 16) -split '(.{4})' | Where-Object { $_ }) -join ' '); printer = "file:$receipts" } |
            ConvertTo-Json | Set-Content $answers -Encoding ascii
          & $exe setup counter --answers $answers --result $result; if ($LASTEXITCODE) { throw 'setup counter failed' }
          if (Test-Path $answers) { throw 'the answers were not deleted' }
          $r = Get-Content $result -Raw | ConvertFrom-Json
          if ($r.enrol_url -ne 'https://127.0.0.2/enrol#code=4827-1093') { throw "enrol URL $($r.enrol_url)" }
          if ($r.printer_line -ne 'haq-helper server printer T02 127.0.0.1') { throw "printer line $($r.printer_line)" }
          if (-not (Get-ChildItem Cert:\LocalMachine\Root | Where-Object Thumbprint -eq $ca.Thumbprint)) { throw 'the certificate is not trusted' }
          $rule = Get-NetFirewallRule -Group 'HAQ Retail OS' | Get-NetFirewallAddressFilter
          if ($rule.RemoteAddress -ne '127.0.0.2') { throw "the bridge's rule lets in $($rule.RemoteAddress)" }
          $link = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\StartUp\HAQ Retail OS.lnk'
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          if ($shortcut.Arguments -notlike '--kiosk https://127.0.0.2/counter*') { throw "the shortcut opens $($shortcut.TargetPath) $($shortcut.Arguments)" }
          # Windows Update never restarts a shop PC from 6:00 to 23:00 (D98): the setting and the policy.
          $hours = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings'
          if ($hours.ActiveHoursStart -ne 6 -or $hours.ActiveHoursEnd -ne 23 -or $hours.SmartActiveHoursState -ne 0) { throw "the active hours are not 6:00 to 23:00: $($hours | Out-String)" }
          $policy = Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          if ($policy.SetActiveHours -ne 1 -or $policy.ActiveHoursStart -ne 6 -or $policy.ActiveHoursEnd -ne 23) { throw "the active hours policy is not set: $($policy | Out-String)" }

          # The bridge lets in the server, 127.0.0.2, and nobody else.
          function Send([string] $from, [byte[]] $bytes) {
            $client = [Net.Sockets.TcpClient]::new([Net.IPEndPoint]::new([Net.IPAddress]::Parse($from), 0))
            $client.Connect('127.0.0.1', 9100); $client.GetStream().Write($bytes, 0, $bytes.Length); $client.Close()
          }
          $job = [byte[]]((0x1b, 0x40) + [Text.Encoding]::ASCII.GetBytes("From the server`n"))
          $deadline = (Get-Date).AddSeconds(30)
          while ($true) { try { Send '127.0.0.2' $job; break } catch { if ((Get-Date) -gt $deadline) { throw 'the bridge never listened' }; Start-Sleep 1 } }
          try { Send '127.0.0.1' ([byte[]]((0x1b, 0x40) + [Text.Encoding]::ASCII.GetBytes("From someone else`n"))) } catch { Write-Host "Refused: $_" }
          while (-not ((Test-Path $receipts) -and (Get-Item $receipts).Length -ge $job.Length)) {
            if ((Get-Date) -gt $deadline) { throw 'the server''s receipt never printed' }; Start-Sleep -Milliseconds 200
          }
          Start-Sleep -Seconds 2
          if ((Get-Item $receipts).Length -ne $job.Length) { throw 'someone other than the server printed' }

          & $exe setup remove; if ($LASTEXITCODE) { throw 'setup remove failed' }
          if ((& $exe service state) -ne 'not installed') { throw 'the service is still there' }
          if (Get-NetFirewallRule -Group 'HAQ Retail OS' -ErrorAction SilentlyContinue) { throw 'the firewall rules are still there' }
          if (Test-Path $link) { throw 'the shortcut is still there' }
          if (Get-ChildItem Cert:\LocalMachine\Root | Where-Object Thumbprint -eq $ca.Thumbprint) { throw 'the certificate is still trusted' }
          if (Get-ScheduledTask -TaskPath '\HAQ Retail OS\' -ErrorAction SilentlyContinue) { throw 'the tasks are still there' }
          if ((Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate' -ErrorAction SilentlyContinue).SetActiveHours) { throw 'the active hours policy is still there' }
          Get-Content C:\ProgramData\HAQ\logs\service.log -Tail 5
          Stop-Job $shop; Remove-Job $shop -Force

  # The spike's scripts on a real Windows, in Windows PowerShell 5.1 as they run at a shop (D86): its parser,
  # and the hidden account's right to sign in as a batch job, without which its scheduled tasks never start.
  windows-scripts-on-windows:
    name: windows scripts on Windows
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Windows PowerShell 5.1's parser
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem apps\windows -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host ("{0}:{1}: {2}" -f $file.FullName, $e.Extent.StartLineNumber, $e.Message); $failed = $true }
          }
          Write-Host "Windows PowerShell $($PSVersionTable.PSVersion)"
          if ($failed) { exit 1 }

      - name: A task runs as a new local account once it holds the batch sign-in right
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File apps\windows\spike\test-account-rights.ps1

  # The setup program (D86, D88), made by Inno Setup on Windows with this commit's HAQ Helper and haq-server
  # distribution. It installs a counter silently against a stand-in server, runs again as an update, and is
  # uninstalled. The one built on main or a release branch is kept for 90 days, to try on a PC.
  windows-setup:
    name: windows setup
    needs: windows-distro
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/windows/helper/go.mod
          cache-dependency-path: apps/windows/helper/go.sum

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: haq-server-distro
          path: ${{ runner.temp }}/distro

      - name: Inno Setup 6.7.4, checked against its SHA-256
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') { throw "Inno Setup's download is not the one pinned: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\ISCC.exe")) { throw 'Inno Setup did not install' }
          "INNO=$dir" >> $env:GITHUB_ENV

      - name: Build the setup
        shell: pwsh
        run: |
          $version = 'main-' + '${{ github.sha }}'.Substring(0, 7)
          $helper = Join-Path $env:RUNNER_TEMP 'haq-helper.exe'
          go build -C apps/windows/helper -trimpath -ldflags "-s -w -X main.version=$version" -o $helper ./cmd/haq-helper
          if ($LASTEXITCODE) { throw 'the helper did not build' }
          $out = Join-Path $env:RUNNER_TEMP 'setup'
          & "$env:INNO\ISCC.exe" /Qp "/DAppVersion=$version" /DTag=main "/DHelper=$helper" `
            "/DDistro=$env:RUNNER_TEMP\distro\haq-server.tar.gz" "/O$out" apps\windows\setup\haq-setup.iss
          if ($LASTEXITCODE) { throw 'ISCC failed' }
          Get-ChildItem $out | Format-Table Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB) } } | Out-String | Write-Host

      - name: The setup installs a counter silently, updates it, then uninstalls
        shell: pwsh
        run: pwsh -NoProfile -File apps/windows/setup/test-setup.ps1 -Setup (Get-ChildItem "$env:RUNNER_TEMP\setup\*.exe").FullName

      # An older release's setup never runs over a newer release (D137). The PC is made to look as if release
      # 2026.12.1 were installed, and the setup of release 2026.1.1, built here with a stand-in distribution,
      # must stop before it installs anything.
      - name: An older release's setup refuses to run over a newer one
        shell: pwsh
        run: |
          $stand = Join-Path $env:RUNNER_TEMP 'stand-in.tar.gz'
          Set-Content $stand 'a stand-in distribution, never extracted for a counter' -Encoding ascii
          $out = Join-Path $env:RUNNER_TEMP 'older'
          & "$env:INNO\ISCC.exe" /Qp /DAppVersion=2026.1.1 /DNumericVersion=2026.1.1.0 /DTag=2026.1.1 `
            "/DHelper=$env:RUNNER_TEMP\haq-helper.exe" "/DDistro=$stand" "/O$out" apps\windows\setup\haq-setup.iss
          if ($LASTEXITCODE) { throw 'ISCC failed' }
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{6F1E4F2B-6C1D-4E5B-9A43-1B7B2E0C9D21}_is1'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -LiteralPath $key -Name DisplayVersion -Value 2026.12.1
          $log = Join-Path $env:RUNNER_TEMP 'older.log'
          $p = Start-Process "$out\HAQ-Retail-OS-Setup-2026.1.1.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log", '/MODE=counter' -PassThru
          if (-not $p.WaitForExit(120000)) { throw 'the older setup did not stop within 2 minutes' }
          Get-Content $log -Tail 10 | Write-Host
          if (-not $p.ExitCode) { throw 'the older setup ran over a newer release' }
          if (-not (Select-String -Path $log -Pattern 'newer than this setup' -SimpleMatch -Quiet)) { throw 'the older setup stopped, but not for being older' }
          if (Test-Path "$env:ProgramFiles\HAQ Retail OS\haq-helper.exe") { throw 'the older setup installed its helper' }
          Remove-Item -LiteralPath $key -Recurse
          Write-Host 'The older setup stopped before installing anything.'

      - name: Keep the setup, from main
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: haq-retail-os-setup
          path: ${{ runner.temp }}/setup/*.exe
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

  shop-server-php:
    name: shop-server PHP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/shop-server
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      # Tests run as the app role; the owner role only rebuilds the schema (spec section 4).
      DB_USERNAME: retail_app
      DB_PASSWORD: app-ci
      DB_OWNER_USERNAME: retail_owner
      DB_OWNER_PASSWORD: owner-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create the three database roles and the test database
        working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres-ci
          POSTGRES_USER: postgres
          RETAIL_OWNER_PASSWORD: owner-ci
          RETAIL_APP_PASSWORD: app-ci
          RETAIL_REPORTING_PASSWORD: reporting-ci
          RETAIL_DATABASES: retail_test retail_concurrency
        run: apps/shop-server/docker/postgres/init/01-roles.sh

      # The same PHP minor and extensions as the image (apps/shop-server/docker/Dockerfile).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, pcntl, bcmath, zip
          coverage: pcov

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('apps/shop-server/composer.lock') }}

      - name: Install
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name: Composer audit (known advisories in the PHP packages)
        run: composer audit --locked

      - name: Pint
        run: composer lint

      - name: Larastan
        run: composer analyse

      # The floor stops coverage falling unnoticed: 92.4% when it was set (10 November 2026). Raise it as tests
      # are added; never lower it (D65).
      - name: Pest, against PostgreSQL 18 (architecture and feature tests), with a coverage floor
        run: composer test -- --coverage --min=90

      - name: Pest, the multi-process suite (concurrency, committed transactions)
        run: composer test:concurrency

  shop-server-js:
    name: shop-server JS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/shop-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: apps/shop-server/package-lock.json

      - name: Install
        run: npm ci

      - name: npm audit (known advisories in the JavaScript packages)
        # Fails on any high or critical advisory except those in npm-audit-allow.json, each with its reason (D85).
        run: node ../../tools/ci/npm-audit.mjs

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run types

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  shop-server-browser:
    name: shop-server browser
    runs-on: ubuntu-24.04
    timeout-minutes: 35 # 20, and up to 15 waiting for a new day in Lagos (e2e/global-setup.ts)
    defaults:
      run:
        working-directory: apps/shop-server
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: retail_e2e
      DB_USERNAME: retail_app
      DB_PASSWORD: app-ci
      DB_OWNER_USERNAME: retail_owner
      DB_OWNER_PASSWORD: owner-ci
      # The built assets, never a Vite dev server.
      VITE_HOT_FILE: /tmp/no-hot-file
      APP_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create the three database roles and the browser-test database
        working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres-ci
          POSTGRES_USER: postgres
          RETAIL_OWNER_PASSWORD: owner-ci
          RETAIL_APP_PASSWORD: app-ci
          RETAIL_REPORTING_PASSWORD: reporting-ci
          RETAIL_DATABASES: retail_e2e
        run: apps/shop-server/docker/postgres/init/01-roles.sh

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, pcntl, bcmath, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('apps/shop-server/composer.lock') }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: apps/shop-server/package-lock.json

      - name: Install and build
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Start a fresh test shop (retail_e2e) with the print queue and a stand-in printer
        run: |
          nohup sh e2e/serve.sh > storage/logs/e2e-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/up >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat storage/logs/e2e-server.log
          exit 1

      - name: Playwright, the counter in Chromium
        env:
          BASE_URL: http://localhost:8000
        run: npx playwright test -c e2e/playwright.config.ts

      - name: The test server's log, on failure
        if: failure()
        run: tail -n 200 storage/logs/e2e-server.log storage/logs/e2e-queue.log storage/logs/laravel.log || true

  # The upgrade-path test (spec section 14, check E5) [F16]: an older version builds a shop with sales, the
  # code under review migrates it in order, the older code still sells against the newer schema, and the
  # newer code's rehearsal check passes over every sale. It runs from the end of Phase 3 (b34d27e), a shop
  # several versions behind, and from each release a shop may still run (D81): add a release here when it
  # goes to a shop, and take it away when no shop runs it any more. It also runs from the code just before
  # this change (the merge commit's first parent): that code is above the rollback floor (D106), so its own
  # migrate job, grant check and data export run against the newer schema, as a code-only rollback does
  # (D105).
  upgrade-path:
    name: upgrade path
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: retail_upgrade_test
      DB_USERNAME: retail_app
      DB_PASSWORD: app-ci
      DB_OWNER_USERNAME: retail_owner
      DB_OWNER_PASSWORD: owner-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create the three database roles and the upgrade database
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres-ci
          POSTGRES_USER: postgres
          RETAIL_OWNER_PASSWORD: owner-ci
          RETAIL_APP_PASSWORD: app-ci
          RETAIL_REPORTING_PASSWORD: reporting-ci
          RETAIL_DATABASES: retail_upgrade_test
        run: apps/shop-server/docker/postgres/init/01-roles.sh

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, pcntl, bcmath, zip
          coverage: none

      - name: Choose the older versions
        # On a pull request HEAD is the merge commit, so its first parent is the base branch; on main it is
        # the commit before.
        run: echo "OLDER=b34d27e 2026.11.2 $(git rev-parse --short HEAD^1)" >> "$GITHUB_ENV"

      - name: Install the older versions and the newer code
        run: |
          for from in $OLDER; do git worktree add --detach "$RUNNER_TEMP/old-$from" "$from"; done
          for dir in $(for from in $OLDER; do echo "$RUNNER_TEMP/old-$from/apps/shop-server"; done) apps/shop-server; do
            (cd "$dir" && composer install --no-interaction --no-progress --prefer-dist && cp .env.example .env && php artisan key:generate)
          done

      - name: Upgrade through every migration in order, and sell on both versions
        run: |
          for from in $OLDER; do
            echo "::group::From $from"
            tools/release/upgrade-path.sh "$RUNNER_TEMP/old-$from/apps/shop-server" "$PWD/apps/shop-server"
            echo "::endgroup::"
          done

  # The restore drill (spec section 9, check E1) [F2, D35]: a shop with sales on the development stack is
  # backed up by pgBackRest, restored into a temporary PostgreSQL, and verified by the app, row counts and
  # every audit chain, as a shop's weekly test restore is.
  restore-drill:
    name: restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the development stack and install its packages
        run: |
          docker compose build app db
          docker compose run --rm --no-deps app composer install --no-interaction --no-progress --prefer-dist
          cp apps/shop-server/.env.example apps/shop-server/.env
          docker compose run --rm --no-deps app php artisan key:generate

      - name: Back up a shop with sales, restore it, and verify the copy
        run: tools/backup/restore-drill.sh

  shop-server-image:
    name: shop-server image ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [dev, app, web, db]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the Compose files
        if: matrix.target == 'dev'
        run: |
          docker compose config --quiet
          for v in APP_KEY RETAIL_APP_PASSWORD APP_IMAGE WEB_IMAGE DB_IMAGE SERVER_NAME SERVER_IP; do export "$v=check"; done
          mkdir -p apps/shop-server/deploy/secrets && touch apps/shop-server/deploy/secrets/{postgres,owner,app,reporting}_password
          docker compose -f apps/shop-server/deploy/compose.yaml config --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The layer that takes Debian's and Alpine's security updates is made again each day; from the cache
      # it would never take a fix released since (D78).
      - name: Today, for the security updates
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build the ${{ matrix.target }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/shop-server/docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          build-args: SECURITY_UPDATES=${{ steps.day.outputs.day }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          load: ${{ matrix.target != 'dev' }}
          tags: retail-os-${{ matrix.target }}:ci

      # Known vulnerabilities with a fix, high or critical, fail the build (D65). gosu (from the official
      # PostgreSQL image) only switches user before PostgreSQL starts; the scanners' reports on its Go
      # library (TLS, URL parsing) concern code it never runs, as that image's maintainers explain.
      - name: Scan the ${{ matrix.target }} image
        if: matrix.target != 'dev'
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1
          --skip-files usr/local/bin/gosu retail-os-${{ matrix.target }}:ci

      # The off-site copy's whole round trip in the db image: key, encrypted copy, two shares open it (D53).
      - name: Off-site copy self-test
        if: matrix.target == 'db'
        run: docker run --rm --user postgres retail-os-db:ci haq-offsite.sh selftest

      # The backup loop's schedule and the backup disk's marker (D128, D129): what is due when, a failed
      # test restore waiting a day or for a newer backup, and no backups where the disk's marker is missing.
      - name: Backup schedule self-test
        if: matrix.target == 'db'
        run: docker run --rm --user postgres retail-os-db:ci haq-backup.sh selftest

  # On every merge to main: build each shop image once and push it to GHCR, tagged main and with the commit
  # (spec section 4) [D1, D2]. Staging on the product owner's computer and the G3 virtual machines pull these.
  # A release branch's images are pushed too, tagged with the commit only: `main` never points at a fix
  # that is not on main, and a release takes its images by commit (D81).
  publish-images:
    name: publish images to GHCR
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    needs: [docs, shop-server-php, shop-server-js, shop-server-browser, upgrade-path, restore-drill, shop-server-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [app, web, db]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Today, for the security updates
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build and push retail-os-${{ matrix.target }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/shop-server/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}-${{ github.sha }}
            SECURITY_UPDATES=${{ steps.day.outputs.day }}
          tags: |
            ghcr.io/haq-technologies/retail-os-${{ matrix.target }}:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/haq-technologies/retail-os-{0}:main', matrix.target) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/haq-technologies/haq-retailOS
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
