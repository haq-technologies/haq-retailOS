# CI for HAQ Retail OS. It guards the documents and the catalogue, and checks the shop server on every
# pull request: PHP style, static analysis and tests against a real PostgreSQL; the frontend's lint,
# types, tests and build; and the PHP image build. Playwright and the multi-process PostgreSQL harness
# join later in Phase 2 and in Phase 3 (PLAN.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Rebuild catalogue v1.1 and compare with the committed files
        run: |
          out="$RUNNER_TEMP/catalogue"
          mkdir -p "$out"
          python3 -I tools/catalogue/build_catalogue_v11.py docs/archive/starter-catalogue-v1.json \
            "$out/starter-catalogue-v1.1.json" "$out/starter-catalogue-v1.1.xlsx" "$out/appendix-c-starter-catalogue-v1.1.md"
          for f in starter-catalogue-v1.1.json starter-catalogue-v1.1.xlsx appendix-c-starter-catalogue-v1.1.md; do
            cmp "$out/$f" "docs/catalogue/$f" || { echo "::error file=docs/catalogue/$f::Generated file is out of date. Rerun the build command in CLAUDE.md and commit the result."; exit 1; }
          done

      - name: Verify catalogue v1.1
        run: |
          python3 -I tools/catalogue/verify_v11.py docs/archive/starter-catalogue-v1.json \
            docs/catalogue/starter-catalogue-v1.1.json docs/catalogue/starter-catalogue-v1.1.xlsx \
            docs/catalogue/appendix-c-starter-catalogue-v1.1.md

      - name: Check Markdown tables and links
        run: python3 -I tools/docs/check_markdown.py

      - name: Release signing dry run (a throwaway key; the updater's own checks)
        run: tools/release/dry-run.sh

  shop-server-php:
    name: shop-server PHP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/shop-server
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      # Tests run as the app role; the owner role only rebuilds the schema (spec section 4).
      DB_USERNAME: retail_app
      DB_PASSWORD: app-ci
      DB_OWNER_USERNAME: retail_owner
      DB_OWNER_PASSWORD: owner-ci
    steps:
      - uses: actions/checkout@v7

      - name: Create the three database roles and the test database
        working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres-ci
          POSTGRES_USER: postgres
          RETAIL_OWNER_PASSWORD: owner-ci
          RETAIL_APP_PASSWORD: app-ci
          RETAIL_REPORTING_PASSWORD: reporting-ci
          RETAIL_DATABASES: retail_test retail_concurrency
        run: apps/shop-server/docker/postgres/init/01-roles.sh

      # The same PHP minor and extensions as the image (apps/shop-server/docker/Dockerfile).
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, pcntl, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('apps/shop-server/composer.lock') }}

      - name: Install
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: composer lint

      - name: Larastan
        run: composer analyse

      - name: Pest, against PostgreSQL 18 (architecture and feature tests)
        run: composer test

      - name: Pest, the multi-process suite (concurrency, committed transactions)
        run: composer test:concurrency

  shop-server-js:
    name: shop-server JS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/shop-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: apps/shop-server/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run types

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  shop-server-browser:
    name: shop-server browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/shop-server
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: retail_e2e
      DB_USERNAME: retail_app
      DB_PASSWORD: app-ci
      DB_OWNER_USERNAME: retail_owner
      DB_OWNER_PASSWORD: owner-ci
      # The built assets, never a Vite dev server.
      VITE_HOT_FILE: /tmp/no-hot-file
      APP_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7

      - name: Create the three database roles and the browser-test database
        working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres-ci
          POSTGRES_USER: postgres
          RETAIL_OWNER_PASSWORD: owner-ci
          RETAIL_APP_PASSWORD: app-ci
          RETAIL_REPORTING_PASSWORD: reporting-ci
          RETAIL_DATABASES: retail_e2e
        run: apps/shop-server/docker/postgres/init/01-roles.sh

      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, pcntl, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('apps/shop-server/composer.lock') }}

      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: apps/shop-server/package-lock.json

      - name: Install and build
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Start a fresh test shop (retail_e2e) with the print queue and a stand-in printer
        run: |
          nohup sh e2e/serve.sh > storage/logs/e2e-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/up >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat storage/logs/e2e-server.log
          exit 1

      - name: Playwright, the counter in Chromium
        env:
          BASE_URL: http://localhost:8000
        run: npx playwright test -c e2e/playwright.config.ts

      - name: The test server's log, on failure
        if: failure()
        run: tail -n 200 storage/logs/e2e-server.log storage/logs/e2e-queue.log storage/logs/laravel.log || true

  # The upgrade-path test (spec section 14, check E5) [F16]: the end of Phase 3 (b34d27e) builds a shop with
  # sales, the code under review migrates it in order, the older code still sells against the newer schema,
  # and the newer code's rehearsal check passes over every sale.
  upgrade-path:
    name: upgrade path
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: retail_upgrade_test
      DB_USERNAME: retail_app
      DB_PASSWORD: app-ci
      DB_OWNER_USERNAME: retail_owner
      DB_OWNER_PASSWORD: owner-ci
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create the three database roles and the upgrade database
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres-ci
          POSTGRES_USER: postgres
          RETAIL_OWNER_PASSWORD: owner-ci
          RETAIL_APP_PASSWORD: app-ci
          RETAIL_REPORTING_PASSWORD: reporting-ci
          RETAIL_DATABASES: retail_upgrade_test
        run: apps/shop-server/docker/postgres/init/01-roles.sh

      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, pcntl, bcmath
          coverage: none

      - name: Install the older and the newer code
        run: |
          git worktree add --detach "$RUNNER_TEMP/old" b34d27e
          for dir in "$RUNNER_TEMP/old/apps/shop-server" apps/shop-server; do
            (cd "$dir" && composer install --no-interaction --no-progress --prefer-dist && cp .env.example .env && php artisan key:generate)
          done

      - name: Upgrade through every migration in order, and sell on both versions
        run: tools/release/upgrade-path.sh "$RUNNER_TEMP/old/apps/shop-server" "$PWD/apps/shop-server"

  shop-server-image:
    name: shop-server image ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [dev, app, web, db]
    steps:
      - uses: actions/checkout@v7

      - name: Check the Compose files
        if: matrix.target == 'dev'
        run: |
          docker compose config --quiet
          for v in APP_KEY RETAIL_APP_PASSWORD APP_IMAGE WEB_IMAGE DB_IMAGE SERVER_NAME SERVER_IP; do export "$v=check"; done
          mkdir -p apps/shop-server/deploy/secrets && touch apps/shop-server/deploy/secrets/{postgres,owner,app,reporting}_password
          docker compose -f apps/shop-server/deploy/compose.yaml config --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Build the ${{ matrix.target }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/shop-server/docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          load: ${{ matrix.target == 'db' }}
          tags: retail-os-${{ matrix.target }}:ci

      # The off-site copy's whole round trip in the db image: key, encrypted copy, two shares open it (D53).
      - name: Off-site copy self-test
        if: matrix.target == 'db'
        run: docker run --rm --user postgres retail-os-db:ci haq-offsite.sh selftest

  # On every merge to main: build each shop image once and push it to GHCR, tagged main and with the commit
  # (spec section 4) [D1, D2]. Staging on the product owner's computer and the G3 install pull these.
  publish-images:
    name: publish images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docs, shop-server-php, shop-server-js, shop-server-browser, shop-server-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [app, web, db]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push retail-os-${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/shop-server/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          build-args: APP_VERSION=main-${{ github.sha }}
          tags: |
            ghcr.io/haq-technologies/retail-os-${{ matrix.target }}:main
            ghcr.io/haq-technologies/retail-os-${{ matrix.target }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/haq-technologies/haq-retailOS
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
