# Dependency updates (D65): a weekly pull request per ecosystem, minor and patch updates grouped, so a
# security fix arrives as a reviewed pull request with CI, never straight onto main. Major versions come
# one at a time, because the stack's versions are pinned on purpose (D20).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /apps/shop-server
    schedule:
      interval: weekly
      day: monday
    groups:
      php:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/shop-server
    schedule:
      interval: weekly
      day: monday
    groups:
      javascript:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/shop-server/docker
    schedule:
      interval: weekly
      day: monday
