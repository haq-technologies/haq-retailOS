# Dependency updates (D65): a weekly pull request per ecosystem, minor and patch updates grouped, so a
# security fix arrives as a reviewed pull request with CI, never straight onto main. Major versions come
# one at a time, because the stack's versions are pinned on purpose (D20).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /apps/shop-server
    schedule:
      interval: weekly
      day: monday
    groups:
      php:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/shop-server
    schedule:
      interval: weekly
      day: monday
    groups:
      javascript:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 waits for typescript-eslint to accept it: typescript-eslint 8.72 asks for a TypeScript below 7,
      # so npm will not install the two together (audit finding AU8, 19 November 2026). Remove this once it does.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /apps/shop-server/docker
    schedule:
      interval: weekly
      day: monday

  # The Ubuntu the haq-server distribution is built from (D86).
  - package-ecosystem: docker
    directory: /apps/windows/distro
    schedule:
      interval: weekly
      day: monday

  # The HAQ Helper's Go module (D88).
  - package-ecosystem: gomod
    directory: /apps/windows/helper
    schedule:
      interval: weekly
      day: monday
    groups:
      go:
        update-types: [minor, patch]
